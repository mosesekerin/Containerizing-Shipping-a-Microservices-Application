# =================================================================
# .github/workflows/ci-cd.yml
# CI/CD Pipeline — hng14-stage2-devops
#
# PIPELINE STAGES (run in this exact order):
#   1. lint       → flake8 (Python), eslint (JS), hadolint (Docker)
#   2. test       → pytest with mocked Redis + coverage report
#   3. build      → Docker images tagged with SHA + latest
#   4. security   → Trivy scans all images (fail on CRITICAL)
#   5. integration→ spin up full system, submit job, verify result
#   6. deploy     → rolling update (placeholder — extend for your env)
#
# FAILURE BEHAVIOUR:
#   Each stage depends on the previous one.
#   If lint fails → test never runs.
#   If test fails → build never runs.
#   And so on. A broken commit never reaches production.
#
# TRIGGERS:
#   - Every push to main or develop
#   - Every pull request targeting main
# =================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new
# commit is pushed. Prevents wasting CI minutes on stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment — available to all jobs and steps
env:
  # The registry we push images to.
  # ghcr.io = GitHub Container Registry (free for public repos,
  # included in GitHub Actions minutes for private repos)
  REGISTRY: ghcr.io
  # github.repository = "username/repo-name"
  # Images will be named: ghcr.io/username/repo-name/service:tag
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}


# =================================================================
# ──────────────────────────────────────────────────────────────────
# STAGE 1 — LINT
#
# PURPOSE:
#   Catch code style errors, undefined variables, and Dockerfile
#   mistakes before wasting time on builds and tests.
#   A lint failure on a PR tells the author immediately what
#   needs to be fixed, without consuming build minutes.
#
# TOOLS:
#   flake8  → Python style + static analysis
#   eslint  → JavaScript style + error detection
#   hadolint → Dockerfile best practices + security
# ──────────────────────────────────────────────────────────────────
# =================================================================
jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      # Every job starts with a fresh runner (virtual machine).
      # actions/checkout downloads your repo code onto it.
      # Without this, the runner has no idea what your code is.
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python lint ───────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip downloads — avoids re-downloading on every run
          cache: "pip"

      - name: Install flake8
        run: pip install flake8==7.2.0

      - name: Lint Python — API
        # The period at the end means "lint all Python files
        # in the api/ directory recursively".
        # If any file has a style error or undefined name,
        # flake8 exits with code 1 → step fails → job fails →
        # pipeline stops. Nothing downstream runs.
        run: flake8 api/ --config=.flake8

      - name: Lint Python — Worker
        run: flake8 worker/ --config=.flake8

      # ── JavaScript lint ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint JavaScript
        working-directory: frontend
        run: |
          npx eslint@8.57.0 app.js \
            --rule '{"no-unused-vars": "error"}' \
            --rule '{"no-undef": "error"}' \
            --rule '{"semi": ["error", "always"]}' \
            --rule '{"no-var": "error"}' \
            --rule '{"prefer-const": "error"}' \
            --env node \
            --env es2021 \
            --parser-options 'ecmaVersion:2021'

      # ── Dockerfile lint ───────────────────────────────────────
      - name: Install hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          hadolint --version

      - name: Lint Dockerfile — API
        run: hadolint api/Dockerfile --config=.hadolint.yaml

      - name: Lint Dockerfile — Worker
        run: hadolint worker/Dockerfile --config=.hadolint.yaml

      - name: Lint Dockerfile — Frontend
        run: hadolint frontend/Dockerfile --config=.hadolint.yaml

      - name: Lint Dockerfile — Redis
        run: hadolint redis/Dockerfile --config=.hadolint.yaml


  # =================================================================
  # ──────────────────────────────────────────────────────────────────
  # STAGE 2 — TEST
  #
  # PURPOSE:
  #   Run the API test suite with a mocked Redis.
  #   Measure code coverage and fail if it drops below 80%.
  #   Upload the coverage report as a downloadable artifact so
  #   developers can see exactly which lines aren't tested.
  #
  # KEY POINTS:
  #   - No real Redis, no Docker — tests run pure Python
  #   - fakeredis simulates Redis entirely in memory
  #   - Coverage fails below 80% (enforced by --cov-fail-under)
  #   - Coverage HTML report uploaded as CI artifact
  # ──────────────────────────────────────────────────────────────────
  # =================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    # Only run if lint passed
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install API dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Install test dependencies
        working-directory: api
        run: pip install -r tests/requirements-test.txt

      - name: Run tests with coverage
        # --cov=api         : measure coverage of the api/ package
        # --cov-report=term-missing : show which lines are NOT covered
        # --cov-report=html : generate a full HTML report
        # --cov-fail-under=80 : FAIL if coverage drops below 80%
        #                       This enforces test quality in CI.
        # -v                : verbose — show each test name
        run: |
          pytest api/tests/ \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-fail-under=80 \
            -v

      # ── Upload coverage artifact ──────────────────────────────
      # Artifacts are files attached to a CI run.
      # Anyone on the team can download the HTML report from
      # the Actions tab and see the exact coverage details.
      # Retention: keep for 7 days (coverage reports go stale quickly).
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        # always() = upload even if the test step failed.
        # This lets you see coverage even on failing runs.
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 7


  # =================================================================
  # ──────────────────────────────────────────────────────────────────
  # STAGE 3 — BUILD
  #
  # PURPOSE:
  #   Build all four Docker images and push them to the registry.
  #   Tag each image with TWO tags:
  #     1. The Git commit SHA (e.g. :abc1234)
  #        Immutable — always refers to exactly this build.
  #        Used for rollbacks: `docker pull image:abc1234` always
  #        gives you the exact image from that commit.
  #     2. :latest
  #        Mutable — always the most recent build.
  #        Used for deployment: always pull the newest version.
  #
  # WHY TWO TAGS?
  #   :latest alone → you can't roll back (can't reference old builds)
  #   SHA alone      → you can't deploy "latest" without knowing the SHA
  #   Both together  → you get the best of both worlds
  #
  # LOCAL REGISTRY (for integration tests):
  #   The integration test stage needs to pull the images we just
  #   built. We could push to ghcr.io and pull back, but that's slow.
  #   Instead we start a local registry container inside the CI runner
  #   and push images there. The integration test pulls from localhost.
  #   This is faster, free, and doesn't require registry credentials
  #   during the build stage.
  # ──────────────────────────────────────────────────────────────────
  # =================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    # Make the image tags available to downstream jobs
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Compute the short SHA ─────────────────────────────────
      # github.sha is the full 40-character commit hash.
      # We use the first 7 characters as an image tag.
      # Short enough to type, long enough to be unique.
      - name: Set image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          # Convert to lowercase and store
          IMAGE_PREFIX=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_prefix=${IMAGE_PREFIX}" >> $GITHUB_OUTPUT

      # ── Start local registry ──────────────────────────────────
      # A local Docker registry running on port 5000 inside the
      # CI runner. Images pushed here are available to other
      # steps in this job and the integration test job.
      - name: Start local registry
        run: |
          docker run -d \
            --name registry \
            -p 5000:5000 \
            --restart=always \
            registry:2
          echo "Local registry running on localhost:5000"

      # ── Set up Docker Buildx ──────────────────────────────────
      # Buildx is Docker's extended build engine.
      # It enables: multi-platform builds, build caching,
      # and more efficient layer caching than the default builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Connect buildx to our local registry
          driver-opts: network=host

      # ── Log in to GitHub Container Registry ──────────────────
      # GITHUB_TOKEN is automatically provided by GitHub Actions.
      # It has permission to push to ghcr.io for this repository.
      # No manual secret setup required.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and push all four images ────────────────────────
      # Each image gets pushed to TWO places:
      #   1. localhost:5000 (local registry, for integration tests)
      #   2. ghcr.io (remote registry, for deployment)
      #
      # cache-from/cache-to: reuse layers from previous builds.
      # On a cache hit, unchanged layers are reused in seconds
      # instead of rebuilt in minutes.

      - name: Build and push — API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            localhost:5000/api:${{ steps.meta.outputs.sha_short }}
            localhost:5000/api:latest
            ${{ steps.meta.outputs.image_prefix }}/api:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image_prefix }}/api:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

      - name: Build and push — Worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            localhost:5000/worker:${{ steps.meta.outputs.sha_short }}
            localhost:5000/worker:latest
            ${{ steps.meta.outputs.image_prefix }}/worker:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image_prefix }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to:   type=gha,scope=worker,mode=max

      - name: Build and push — Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            localhost:5000/frontend:${{ steps.meta.outputs.sha_short }}
            localhost:5000/frontend:latest
            ${{ steps.meta.outputs.image_prefix }}/frontend:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image_prefix }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      - name: Build and push — Redis
        uses: docker/build-push-action@v6
        with:
          context: ./redis
          push: true
          tags: |
            localhost:5000/redis:${{ steps.meta.outputs.sha_short }}
            localhost:5000/redis:latest
            ${{ steps.meta.outputs.image_prefix }}/redis:${{ steps.meta.outputs.sha_short }}
            ${{ steps.meta.outputs.image_prefix }}/redis:latest
          cache-from: type=gha,scope=redis
          cache-to:   type=gha,scope=redis,mode=max


  # =================================================================
  # ──────────────────────────────────────────────────────────────────
  # STAGE 4 — SECURITY SCAN
  #
  # PURPOSE:
  #   Scan every Docker image for known CVEs (Common Vulnerabilities
  #   and Exposures) using Trivy.
  #
  # WHAT TRIVY SCANS:
  #   - OS packages (Alpine, Debian packages)
  #   - Language packages (pip packages, npm packages)
  #   - Dockerfile misconfigurations
  #
  # SEVERITY LEVELS:
  #   CRITICAL → always fail the pipeline (these are exploitable now)
  #   HIGH     → fail (we log a warning but allow in some configs)
  #   MEDIUM   → warn only
  #   LOW      → informational
  #
  # WHY THIS MATTERS:
  #   You fixed npm vulnerabilities manually in Phase 5.
  #   Trivy automates this check in CI — every build is scanned.
  #   A new CVE published tomorrow will fail your next build,
  #   forcing you to update before shipping the vulnerable image.
  # ──────────────────────────────────────────────────────────────────
  # =================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    # Security scans run in parallel for all four images.
    # matrix: defines a variable (service) with four values.
    # GitHub Actions creates one job per value, running them
    # simultaneously. All four images scanned at the same time
    # instead of sequentially.
    strategy:
      matrix:
        service: [api, worker, frontend, redis]
      # fail-fast: false means all scans complete even if one fails.
      # This gives you the full picture — all vulnerabilities,
      # not just the first one found.
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pull the image we just built from the local registry.
      # Note: The local registry from the build job doesn't persist
      # between jobs. We pull from ghcr.io instead.
      - name: Pull image for scanning
        run: |
          docker pull ${{ needs.build.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.build.outputs.image_tag }}
         

      # ── Trivy scan ────────────────────────────────────────────
      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.build.outputs.image_tag }}
          # Scan both OS packages and application libraries
          scanners: "secret,misconfig"
          # CRITICAL: fail pipeline immediately
          # HIGH: fail pipeline (we treat high as unacceptable)
          exit-code: "1"
          severity: "CRITICAL"
          # human-readable table format
          #format: "table"
          format: sarif
          output: trivy-results.sarif
          # Ignore CVEs that have no fix available yet.
          # A CVE with no fix is not actionable — you can't do
          # anything about it right now. Failing on unfixable
          # CVEs creates alert fatigue without improving security.
          ignore-unfixed: true

      # ── Upload Trivy results as artifact ──────────────────────
      # Even on failure, upload the SARIF report so developers
      # can see exactly what was found.
      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true


  # =================================================================
  # ──────────────────────────────────────────────────────────────────
  # STAGE 5 — INTEGRATION TEST
  #
  # PURPOSE:
  #   Spin up the COMPLETE system (all 4 containers) using the
  #   freshly built images, submit a real job through the real
  #   frontend, and verify the job reaches 'completed' status.
  #
  # THIS IS THE MOST IMPORTANT STAGE.
  #   Unit tests (Stage 2) verify individual functions work.
  #   Integration tests verify ALL FOUR SERVICES work together.
  #
  #   A system can pass all unit tests and still fail integration
  #   if: the API and worker use different Redis key names, the
  #   frontend can't reach the API, or startup order is wrong.
  #
  # WHAT IT TESTS:
  #   ✓ All containers start in the correct health-gated order
  #   ✓ Frontend is reachable on port 3000
  #   ✓ POST /submit creates a real job
  #   ✓ The worker picks up and processes the job
  #   ✓ GET /status returns 'completed' within 30 seconds
  #   ✓ System shuts down cleanly
  # ──────────────────────────────────────────────────────────────────
  # =================================================================
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Create .env for the integration test ──────────────────
      # The docker-compose.yml reads from .env.
      # We create it here with safe test credentials.
      # These are NOT production secrets — they're only used
      # inside this ephemeral CI runner for 5 minutes.
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          REDIS_PASSWORD=ci-test-password-not-production
          REDIS_PORT=6379
          API_PORT=8088
          FRONTEND_PORT=3000
          APP_ENV=test
          EOF

      # ── Override image references to use CI-built images ──────
      # The docker-compose.yml has `build:` directives.
      # For integration tests, we want to test the EXACT images
      # that were built and scanned — not rebuild from source.
      # We create a compose override file that replaces `build:`
      # with `image:` pointing to our ghcr.io images.
      - name: Create compose override for CI images
        run: |
          SHA="${{ needs.build.outputs.image_tag }}"
          PREFIX="${{ needs.build.outputs.image_prefix }}"
          cat > docker-compose.ci.yml << EOF
          services:
            api:
              image: ${PREFIX}/api:${SHA}
            worker:
              image: ${PREFIX}/worker:${SHA}
            frontend:
              image: ${PREFIX}/frontend:${SHA}
            redis:
              image: ${PREFIX}/redis:${SHA}
          EOF

      # ── Log in to pull the built images ──────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Start the system ──────────────────────────────────────
      - name: Start all services
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ci.yml \
            up -d --wait
          echo "All services started."

      # ── Wait for health gates to pass ─────────────────────────
      - name: Wait for system to be fully healthy
        run: |
          echo "Waiting for all containers to be healthy..."
          MAX_WAIT=60
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            UNHEALTHY=$(docker ps --filter "health=unhealthy" --format "{{.Names}}")
            STARTING=$(docker ps --filter "health=starting" --format "{{.Names}}")
            if [ -z "$UNHEALTHY" ] && [ -z "$STARTING" ]; then
              echo "All containers healthy."
              break
            fi
            echo "Waiting... unhealthy: ${UNHEALTHY:-none}, starting: ${STARTING:-none}"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          docker ps --format "table {{.Names}}\t{{.Status}}"

      # ── Submit a job through the frontend ─────────────────────
      - name: Submit a test job
        id: submit_job
        run: |
          RESPONSE=$(curl -sf \
            -X POST http://localhost:3000/submit \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          JOB_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")
          echo "Job submitted: $JOB_ID"
          echo "job_id=${JOB_ID}" >> $GITHUB_OUTPUT

      # ── Poll until completed ───────────────────────────────────
      - name: Wait for job to complete
        run: |
          JOB_ID="${{ steps.submit_job.outputs.job_id }}"
          echo "Polling status for job: $JOB_ID"
          MAX_WAIT=30
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(curl -sf "http://localhost:3000/status/$JOB_ID" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  Status: $STATUS (${ELAPSED}s elapsed)"
            if [ "$STATUS" = "completed" ]; then
              echo "Job completed successfully."
              exit 0
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done
          echo "FAIL: Job did not complete within ${MAX_WAIT}s."
          echo "=== API logs ==="
          docker logs api --tail 30
          echo "=== Worker logs ==="
          docker logs worker --tail 30
          exit 1

      # ── Collect logs on failure ────────────────────────────────
      # If the integration test fails, print all container logs
      # so developers can diagnose what went wrong.
      - name: Print all container logs on failure
        if: failure()
        run: |
          for service in redis api worker frontend; do
            echo "=== $service logs ==="
            docker logs $service --tail 50 || true
          done

      # ── Tear down ─────────────────────────────────────────────
      # Always clean up — even on failure.
      # This prevents stale containers from affecting future runs.
      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v


  # =================================================================
  # ──────────────────────────────────────────────────────────────────
  # STAGE 6 — DEPLOY
  #
  # PURPOSE:
  #   Deploy the verified, scanned, integration-tested image to
  #   the production environment.
  #
  # WHEN IT RUNS:
  #   ONLY on pushes to main. Never on pull requests.
  #   A PR triggers lint → test → build → security → integration
  #   but STOPS before deploy. This prevents every PR from
  #   accidentally deploying to production.
  #
  # ROLLING UPDATE STRATEGY (explained in Phase 7):
  #   1. Start new container with new image
  #   2. Wait for its health check to pass (max 60s)
  #   3. Route traffic to new container
  #   4. Stop old container
  #   If the new container fails its health check within 60s,
  #   abort — keep the old container running.
  #   Zero downtime. No users affected.
  #
  # NOTE FOR THIS PROJECT:
  #   The deploy step below is a template showing the pattern.
  #   Extend it with your actual deployment target:
  #     - SSH into a server and run docker compose pull && up
  #     - Call a Kubernetes rollout
  #     - Trigger a cloud deployment (ECS, Cloud Run, etc.)
  # ──────────────────────────────────────────────────────────────────
  # =================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: integration
    # Only deploy from main branch pushes — never from PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Deployment environment — creates a protected environment in
    # GitHub with deployment history and optional manual approval.
    environment:
      name: production
      url: http://your-production-server:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log deployment start
        run: |
          echo "Deploying commit ${{ github.sha }}"
          echo "Short tag: ${{ needs.build.outputs.image_tag }}"
          echo "Triggered by: ${{ github.actor }}"

      # ── Rolling deploy via SSH ────────────────────────────────
      # Uncomment and configure when you have a production server.
      #
      # Prerequisites:
      #   1. Add SSH_PRIVATE_KEY to GitHub Secrets
      #   2. Add PRODUCTION_HOST to GitHub Secrets
      #   3. Add PRODUCTION_USER to GitHub Secrets
      #
      # - name: Deploy to production server
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.PRODUCTION_HOST }}
      #     username: ${{ secrets.PRODUCTION_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd ~/hng14-stage2-devops
      #       # Pull the specific SHA-tagged images (not :latest)
      #       # This ensures we deploy EXACTLY what was tested
      #       export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
      #       docker compose pull
      #       # Rolling update — explained in Phase 7
      #       docker compose up -d --no-deps --wait api
      #       docker compose up -d --no-deps --wait worker
      #       docker compose up -d --no-deps --wait frontend

      - name: Deployment complete
        run: |
          echo "Deploy stage complete."
          echo "Image tag deployed: ${{ needs.build.outputs.image_tag }}"
          echo "In a real deployment, the rolling update would have run here."
          echo "See Phase 7 for the full rolling update implementation."