# ─────────────────────────────────────────────────────────────────
# redis.conf — Production configuration
#
# Redis ships with a massive default config file (~1000 lines).
# We write a minimal, explicit config so every setting is
# intentional and auditable.
# ─────────────────────────────────────────────────────────────────

# ── NETWORK ──────────────────────────────────────────────────────

# Bind to all interfaces inside the container.
# Docker's network layer controls what's actually reachable from
# outside — Redis itself doesn't need to restrict by IP here.
# The docker-compose.yml ensures Redis is NEVER exposed externally.
bind 0.0.0.0

# Default Redis port.
port 6379

# ── AUTHENTICATION ────────────────────────────────────────────────

# Require a password before any command is accepted.
# The actual value is injected via the REDIS_PASSWORD env var
# in docker-compose.yml using the --requirepass flag.
# We leave a placeholder here — the compose file overrides it.
# This ensures Redis refuses all connections if the compose file
# is misconfigured and forgets to set the password.
requirepass PLACEHOLDER_REPLACED_BY_COMPOSE

# ── PERSISTENCE ───────────────────────────────────────────────────

# For a job queue, we want persistence so that a Redis restart
# doesn't lose jobs that are queued but not yet processed.
#
# AOF (Append Only File): every write command is logged to disk.
# On restart, Redis replays the log to restore state.
# This is the safest persistence mode for our use case.
appendonly yes
appendfsync everysec   # flush to disk every second — good balance
                       # of durability vs performance

# RDB snapshots: periodic full dumps (backup).
# save <seconds> <changes>: save if N changes in T seconds.
save 900 1    # save if 1 change in 15 minutes
save 300 10   # save if 10 changes in 5 minutes
save 60 1000  # save if 1000 changes in 1 minute

# ── MEMORY ────────────────────────────────────────────────────────

# Cap memory usage. Without this, Redis will use all available
# memory and get OOM-killed by the kernel — hard crash, data loss.
# Set this to match the mem_limit in docker-compose.yml.
maxmemory 128mb

# What to do when maxmemory is hit:
# allkeys-lru: evict the least-recently-used keys.
# For a job queue, this is acceptable — old jobs get dropped
# rather than the whole service crashing.
maxmemory-policy allkeys-lru

# ── LOGGING ───────────────────────────────────────────────────────

# Log level: notice is appropriate for production.
# debug/verbose produce too much output; warning misses useful info.
loglevel notice

# Log to stdout so Docker can capture it via `docker logs`.
# Redis normally logs to a file; "" means stdout.
logfile ""

# ── TIMEOUTS & CONNECTIONS ────────────────────────────────────────

# Close idle client connections after 300 seconds.
# Prevents connection leaks from crashed clients.
timeout 300

# TCP keepalive: send keepalive packets every 60s.
# Detects dead connections and cleans them up.
tcp-keepalive 60

# Maximum number of simultaneous clients.
# For our 2-service setup (API + Worker), 100 is generous.
maxclients 100

# ── SECURITY ──────────────────────────────────────────────────────

# Disable dangerous commands that have no place in our system.
# FLUSHALL: deletes ALL data instantly
# FLUSHDB: deletes current database
# DEBUG: can crash Redis or expose internals
# CONFIG: can change running config (we set it at startup)
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command DEBUG    ""
rename-command CONFIG   ""
